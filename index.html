<!doctype html>
<html lang="fi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#b5472f">
  <meta name="description" content="Pelejä italian opiskeluun: Tessere ja Impero.">
  <title>Italia – pelit</title>
  <link rel="icon" href="tessere/icon.svg" type="image/svg+xml">
  <style>
    :root { --bg: #f6efe3; --ink: #2a2420; --muted: #7a6d62; --accent: #b5472f; --card: #fffaf0; --edge: #d9ccb6; color-scheme: light dark; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #1d1a17; --ink: #f1e9dc; --muted: #a99c8d; --accent: #e0755a; --card: #3a332c; --edge: #241f1b; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--ink); font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; padding: 24px 16px; }
    h1 { color: var(--accent); margin: 0 0 4px; }
    .sub { color: var(--muted); margin: 0 0 24px; }
    .games { display: grid; gap: 16px; max-width: 520px; }
    a.card { display: grid; grid-template-columns: 64px 1fr; gap: 14px; align-items: center; padding: 16px; border-radius: 16px; background: var(--card); border: 1px solid var(--edge); color: inherit; text-decoration: none; box-shadow: 2px 3px 8px rgb(0 0 0 / 0.12); }
    a.card:active { transform: scale(0.99); }
    .icon { font-size: 44px; text-align: center; }
    .card h2 { margin: 0 0 4px; font-size: 1.2rem; }
    .card p { margin: 0; color: var(--muted); font-size: 0.9rem; line-height: 1.4; }
    .tag { display: inline-block; margin-top: 6px; padding: 1px 8px; border-radius: 999px; background: var(--accent); color: #fff; font-size: 0.7rem; font-weight: 700; }
  </style>
</head>
<body>
  <h1>Italia 🇮🇹</h1>
  <p class="sub">Pelejä italian opiskeluun. Sanojen edistyminen on yhteinen molemmissa.</p>
  <div class="games">
    <a class="card" href="impero/">
      <span class="icon">🏛️</span>
      <span>
        <h2>Impero</h2>
        <p>Rakenna Rooma vuoro vuorolta. Oikeat vastaukset tuottavat ruokaa, tuotantoa, tiedettä ja kultaa.</p>
        <span class="tag">UUSI</span>
      </span>
    </a>
    <a class="card" href="tessere/">
      <span class="icon">🀄</span>
      <span>
        <h2>Tessere</h2>
        <p>Päivän Mahjong-pöytä: etsi suomen sanan ja italian vastineen parit.</p>
      </span>
    </a>
  </div>
</body>
</html>
