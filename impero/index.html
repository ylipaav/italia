<!doctype html>
<html lang="fi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#7a4a1e">
  <meta name="description" content="Rakenna Rooma vuoro vuorolta italiaa oppimalla.">
  <title>Impero – rakenna Rooma italiaksi</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <a class="back" href="../" aria-label="Takaisin pelivalikkoon">‹</a>
    <h1>Impero <span aria-hidden="true">🏛️</span></h1>
    <div class="topbar-right">
      <button class="icon-btn" id="sound-btn" type="button" aria-pressed="true" title="Ääntäminen päällä / pois">🔊</button>
      <button class="icon-btn" id="help-btn" type="button" title="Ohje">❓</button>
    </div>
  </header>

  <div class="resources" id="resources" aria-label="Resurssit"></div>

  <main class="city">
    <div class="city-head">
      <div class="views" role="tablist">
        <button class="view-btn on" id="view-city" type="button" role="tab">🏛️ Roma</button>
        <button class="view-btn" id="view-map" type="button" role="tab">🗺️ Italia</button>
      </div>
      <div class="city-meta" id="city-meta"></div>
    </div>
    <div class="era" id="era"></div>
    <div class="skyline" id="skyline" aria-label="Rakennukset"></div>
    <div class="map" id="map" hidden aria-label="Italian kartta"></div>
    <p class="growth" id="growth"></p>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <nav class="toolbar">
    <button class="tool-btn primary" id="turn-btn" type="button">▶ Vuoro</button>
    <button class="tool-btn" id="build-btn" type="button">🏗️ Rakenna</button>
    <button class="tool-btn" id="tech-btn" type="button">📜 Tutki</button>
  </nav>

  <footer class="version" id="version"></footer>

  <div class="overlay" id="overlay" hidden>
    <div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
