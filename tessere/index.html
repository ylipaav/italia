<!doctype html>
<html lang="fi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#b5472f">
  <meta name="description" content="Päivän Mahjong-pöytä: etsi suomen sanan ja italian vastineen parit. Uusi pöytä joka päivä.">
  <title>Tessere 🀄 – italiaa laatoilla</title>
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Italia – pelejä italian opiskeluun">
  <meta property="og:title" content="Tessere 🀄 – italiaa laatoilla">
  <meta property="og:description" content="Päivän Mahjong-pöytä: etsi suomen sanan ja italian vastineen parit. Uusi pöytä joka päivä.">
  <meta property="og:url" content="https://ylipaav.github.io/italia/tessere/">
  <meta property="og:image" content="https://ylipaav.github.io/italia/tessere/og.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:locale" content="fi_FI">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <a class="back" href="../" aria-label="Takaisin pelivalikkoon">‹</a>
    <h1>Tessere <span aria-hidden="true">🇮🇹</span></h1>
    <div class="topbar-right">
      <button class="icon-btn streak" id="stats-btn" type="button" title="Tilastot"><span id="streak">🔥 0</span></button>
      <button class="icon-btn icon-mode" id="icon-btn" type="button" title="Kuvakkeet"></button>
      <button class="icon-btn" id="sound-btn" type="button" aria-pressed="true" title="Ääntäminen päällä / pois">🔊</button>
    </div>
  </header>

  <div class="status">
    <span id="mode-label">Päivän pöytä</span>
    <span id="pairs-left">20 paria</span>
    <span id="timer">0:00</span>
  </div>

  <main class="board-wrap">
    <div class="board" id="board" aria-label="Pelipöytä"></div>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <nav class="toolbar">
    <button class="tool-btn" id="hint-btn" type="button">💡 Vihje</button>
    <button class="tool-btn" id="shuffle-btn" type="button">🔀 Sekoita</button>
    <button class="tool-btn" id="help-btn" type="button">❓ Ohje</button>
  </nav>

  <footer class="version" id="version"></footer>

  <div class="overlay" id="overlay" hidden>
    <div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
